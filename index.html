<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#1b2430; --sub:#5b6778; --line:#dde3ea; --line2:#eef1f5;
  --pri:#1f3a5f; --pri2:#2c5282; --pri-soft:#e8eef7; --acc:#0f766e; --acc-soft:#e6f4f2;
  --warn:#b45309; --warn-soft:#fef3e2; --bad:#c2410c; --bad-soft:#fdecea; --ok:#15803d; --ok-soft:#e8f6ec; --th:#e8590c; --th-soft:#fff1e6;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.3}
h2{font-size:18px} h3{font-size:15px} h4{font-size:14px}
a{color:var(--pri2)}
.hidden{display:none!important}
.muted{color:var(--sub)} .small{font-size:12px} .tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1}
.sp{height:12px}
.right{margin-left:auto}
.nowrap{white-space:nowrap}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.btn:hover{background:#f6f8fb;border-color:#c9d2dd}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff} .btn.pri:hover{background:var(--pri2)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad);border-color:#f2c4b3} .btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #bfd3ee;border-color:var(--pri2)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub)}
label.f>input,label.f>select{color:var(--ink);font-size:14px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* layout */
#app{max-width:1280px;margin:0 auto;padding:0 16px 60px}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;margin:0 -16px;padding:10px 16px}
header.top .inner{max-width:1248px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top .ttl{font-weight:700;font-size:16px}
header.top .sch{opacity:.85;font-size:13px}
header.top .pill{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
header.top .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}
header.top .dot.on{background:#4ade80}
header.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
header.top .btn:hover{background:rgba(255,255,255,.12)}
.adminbadge{background:#fbbf24!important;color:#3b2a00!important;font-weight:700}
nav.tabs{display:flex;gap:4px;margin:14px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--sub);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
nav.tabs button .lock{font-size:11px;margin-left:4px;opacity:.7}
nav.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav.sub button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer;font-weight:600;color:var(--sub)}
nav.sub button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card>h3:first-child,.card>h2:first-child{margin-top:0}
.help{background:var(--pri-soft);border-radius:8px;padding:10px 12px;color:#23364f;font-size:13px;margin-bottom:12px}
.help b{color:var(--pri)}
.warnbox{background:var(--warn-soft);border:1px solid #f5d7a8;color:#7c3d0a;border-radius:8px;padding:9px 12px;font-size:13px;margin:8px 0}
.okbox{background:var(--ok-soft);border:1px solid #bfe3c9;color:#14532d;border-radius:8px;padding:9px 12px;font-size:13px;margin:8px 0}
.errbox{background:var(--bad-soft);border:1px solid #f4c7bd;color:#8a2c0d;border-radius:8px;padding:9px 12px;font-size:13px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
.stat .v{font-size:22px;font-weight:700} .stat .k{font-size:12px;color:var(--sub)}
.stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:560px}
table.t{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:#f7f9fc;font-weight:600;color:#384456;position:sticky;top:0;z-index:1;white-space:nowrap}
table.t tr:hover td{background:#fafcff}
table.t td.num,table.t th.num{text-align:right}
table.t td.c,table.t th.c{text-align:center}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--line2);color:#475467;white-space:nowrap}
.tag.com{background:#e0ecff;color:#1d4ed8} .tag.sel{background:#fdf0e1;color:#9a4a07}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* dropzone */
.drop{border:2px dashed #b8c4d4;border-radius:10px;padding:22px;text-align:center;color:var(--sub);cursor:pointer;background:#fafbfd}
.drop.over{border-color:var(--pri2);background:var(--pri-soft)}
.drop b{color:var(--pri)}

/* login */
.login{max-width:440px;margin:8vh auto;padding:0 16px}
.login .card{padding:26px}
.login h1{font-size:22px;color:var(--pri)}
.codebox{font:700 24px/1.2 ui-monospace,Consolas,monospace;letter-spacing:2px;background:var(--pri-soft);padding:12px;border-radius:8px;text-align:center;color:var(--pri)}
.demo-banner{background:#fff7e6;border:1px solid #f5d7a8;color:#7c3d0a;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}

/* 결시 입력 chips */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stu{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;cursor:pointer;text-align:left;position:relative;min-height:58px}
.stu:hover{border-color:#9fb3cc}
.stu .nm{font-weight:700} .stu .no{color:var(--sub);font-size:12px;margin-right:4px}
.stu .ex{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu.abs{background:var(--bad-soft);border-color:#eea68f}
.stu.abs .rs{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--bad)}
.stu.off{background:#f3f4f6;color:#9aa3af;cursor:default}
.stu.study .ex{color:#6b7280}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;width:270px}
.pop .row .btn{flex:1;justify-content:center}

/* 고사 시간표 grid */
.tt{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed}
.tt th{font-size:12.5px;color:var(--sub);font-weight:600;padding:4px}
.tt td.cell{background:#fff;border:1.5px solid var(--line);border-radius:10px;height:84px;vertical-align:top;padding:6px;cursor:pointer}
.tt td.cell:hover{border-color:#9fb3cc}
.tt td.cell.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.tt td.cell .meta{font-size:11px;color:var(--sub);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:3px 7px;margin:2px;font-size:12.5px;background:var(--pri-soft);color:#1e3a5f;border:1px solid #c7d6ea}
.chip.sel{background:#fdf0e1;border-color:#f3cf9f;color:#7a3a05}
.chip .x{cursor:pointer;opacity:.6;font-weight:700} .chip .x:hover{opacity:1}
.palette{display:flex;flex-direction:column;gap:10px}
.palette .grp h4{font-size:12px;color:var(--sub);margin:0 0 4px}
.pchip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin:3px;cursor:pointer;background:#fff;min-width:120px}
.pchip:hover{border-color:var(--acc)}
.pchip .n{font-weight:700;font-size:13px}
.pchip .i{font-size:11px;color:var(--sub)}
.pchip.placed{background:#f3f9f8;border-color:#a7d7d0}
.pchip.placed .i b{color:var(--acc)}

/* 좌석 */
.seatwrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.board{background:#1f3a2f;color:#fff;text-align:center;border-radius:6px;padding:6px;font-weight:700;letter-spacing:6px;margin:0 auto 12px;width:60%}
.seats{display:grid;gap:6px}
.seat{border:1px solid #c9d2dd;border-radius:7px;min-height:58px;padding:4px 6px;text-align:center;background:#fff;display:flex;flex-direction:column;justify-content:center}
.seat .sn{font-size:11px;color:var(--sub)} .seat .nm{font-weight:700;font-size:14px} .seat .id{font-size:11px;color:var(--sub)}
.seat .sj{font-size:10.5px;color:#7a3a05}
.seat.study{background:#f6f7f9}
.seat.abs{background:var(--bad-soft);border-color:#eea68f} .seat.abs .nm{text-decoration:line-through;color:var(--bad)}
.seat.none{border:1px dashed #d8dee6;background:transparent}
.seat.x{background:repeating-linear-gradient(45deg,#eef1f5,#eef1f5 6px,#fff 6px,#fff 12px);border-style:dashed}
.seat.edit{cursor:pointer}
.sides{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #c9d2dd;vertical-align:-2px;margin-right:4px}

/* toast & modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1f2937;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast div.err{background:#9a3412}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
footer.cr{text-align:center;color:#98a2b3;font-size:12px;margin-top:30px}

/* ===== 인쇄 ===== */
#print-root{display:none}
@media print{
  @page{size:A4;margin:9mm}
  html,body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  .pg{page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pg{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:#000}
.pg h1{font-size:19px;text-align:center;margin:0 0 4px}
.pg .subt{text-align:center;font-size:13px;margin-bottom:10px}
.pg .board{background:#fff;color:#000;border:2px solid #000;width:50%;letter-spacing:10px}
.pg .seat{border:1.3px solid #000;min-height:0;height:var(--sh,20mm);border-radius:4px}
.pg .seat .nm{font-size:15px} .pg .seat .sn{font-size:11px;color:#000} .pg .seat .id{color:#333}
.pg .seat.none{border:1px dashed #999}
.pg .seat.abs{background:#eee} .pg .seat.abs .nm{color:#000}
.pg .sides{color:#000;font-size:12px}
.pg .sign{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;border-top:1px solid #000;padding-top:6px}
.pg table.pt{border-collapse:collapse;width:100%;font-size:12.5px}
.pg table.pt th,.pg table.pt td{border:1px solid #000;padding:4px 6px;text-align:center}
.pg table.pt th{background:#eee}
.pt-slot{overflow:hidden;border-bottom:1px dashed #888;padding-bottom:2mm;margin-bottom:3mm}
.pt-slot:last-child{border-bottom:0;margin-bottom:0}
.pt-ttl{font-size:12px} .pt-sid{font-weight:400;font-size:13px} .pt-date{font-weight:400} .pt-time{font-weight:400;font-size:10.5px}
.pg table.pt th.pt-pc{width:62px}
/* 3·4명: 압축 */
.pt-c3 .pt-head,.pt-c4 .pt-head{margin-bottom:3px}
.pt-c3 .who{font-size:14px} .pt-c4 .who{font-size:13px}
.pt-c3 .pt-ttl,.pt-c4 .pt-ttl{font-size:10.5px}
.pt-c3 table.pt,.pt-c4 table.pt{font-size:11px}
.pt-c3 table.pt th,.pt-c3 table.pt td{padding:2px 4px}
.pt-c4 table.pt th,.pt-c4 table.pt td{padding:2px 4px;line-height:1.25}
.pt-c3 .pt-cell .s{font-size:12px} .pt-c4 .pt-cell .s{font-size:11.5px}
.pt-c3 .pt-cell .r,.pt-c4 .pt-cell .r{font-size:10px}
.pt-c4 .pt-date{font-size:10px} .pt-c4 th br{display:none} .pt-c4 .pt-date,.pt-c4 .pt-time{margin-left:3px}
.pt-c3 .pt-time,.pt-c4 .pt-time{font-size:9.5px}
.pg.pt-c4 table.pt th.pt-pc,.pg.pt-c3 table.pt th.pt-pc{width:56px}
.pt-c3 .pt-notice,.pt-c4 .pt-notice{font-size:10px;padding:2px 6px;margin-top:3px}
.pt-c4 .pt-notice{white-space:normal}
.pt-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.pt-head .who{font-size:16px;font-weight:700}
.pt-cell .s{font-weight:700;font-size:13px} .pt-cell .r{font-size:11.5px}
.pt-cell.study .s{font-weight:400;color:#444}
.pt-notice{font-size:12px;margin-top:6px;white-space:pre-wrap;border:1px solid #000;padding:5px 8px}
.screen-pg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.pg table.pt.roster td,.pg table.pt.roster th{padding:2px 5px;line-height:1.3;font-size:12px}
.seat .nm.long{font-size:11.5px;line-height:1.15;word-break:break-all}
.pg .seat .nm.long{font-size:11.5px}
.chip.study{background:#f1f3f5;border-color:#d5dbe2;color:#4b5563}
.pchip.study{border-style:dashed}
.seat.nodesk{visibility:hidden}
/* 반별 배정표 */
.cb-sums{border:1px solid #bbb;border-radius:4px;padding:4px 8px;margin:4px 0 6px;font-size:11.5px;line-height:1.55}
.cb-sum small{color:#555;margin-left:1px} .cb-st{color:#666}
.pg table.cb-t,.screen-pg table.cb-t{font-size:11.5px}
.pg table.cb-t td,.pg table.cb-t th{padding:3px 4px;line-height:1.3}
table.cb-t td.cb-nm{text-align:left;white-space:nowrap}
table.cb-t td.cb-stc{color:#777;background:#f3f3f3}
table.cb-t td.cb-mv{font-weight:700}
table.cb-t td.cb-sj{white-space:nowrap}
.cb-foot{font-size:10.5px;color:#555;margin-top:4px}
.screen-pg.cb{max-width:1000px;overflow-x:auto}
/* 반별 배정표: B4 인쇄용 확대 */
@media print{
  .pg.cb .who{font-size:19px} .pg.cb .pt-ttl{font-size:13px}
  .pg.cb .cb-sums{font-size:13.5px;padding:6px 10px;line-height:1.6}
  .pg.cb table.cb-t{font-size:14px}
  .pg.cb table.cb-t td,.pg.cb table.cb-t th{padding:4.5px 6px;line-height:1.35}
  .pg.cb .pt-time{font-size:11.5px}
  .pg.cb .cb-foot{font-size:12px}
}
/* 반별 배정표 · 전체 일차 한눈에 */
table.cb-all td{padding:2px 3px;text-align:center;vertical-align:middle}
table.cb-all td .c1{font-size:11px;font-weight:600;line-height:1.2;word-break:keep-all}
table.cb-all td .c2{font-size:10.5px;color:#333;line-height:1.2}
table.cb-all td.cb-stc .c1{font-weight:400;color:#777}
table.cb-all td .c2.cb-mv{font-weight:800;color:#000}
table.cb-all .dsep{border-left:2.5px solid #000!important}
.cb-sp{margin-right:8px;white-space:nowrap}
.cball .cb-sums{font-size:11px;line-height:1.5}
@media print{
  .pg.cball .cb-sums{font-size:11.5px;padding:4px 8px}
  .pg.cball table.cb-all td,.pg.cball table.cb-all th{padding:1px 3px;line-height:1.12}
  .pg.cball table.cb-all td .c1{font-size:11px;line-height:1.12;white-space:nowrap;letter-spacing:-.3px} .pg.cball table.cb-all td .c2{font-size:10.5px;line-height:1.12}
  .pg.cball table.cb-all{font-size:12px}
}
/* 시험실 좌석배치표 */
.pg.rs h1{font-size:20px;letter-spacing:4px;margin-bottom:8px}
.rs-head{display:flex;justify-content:space-between;align-items:flex-end;font-size:13.5px;margin-bottom:6px}
.rs-head .rs-ttl{font-size:12px;color:#444}
.rs-room{font-size:18px}
table.rs-t{table-layout:fixed}
table.rs-t th,table.rs-t td{padding:2px 4px;line-height:1.3;font-size:12px}
table.rs-t th.rs-c1{width:44px}
table.rs-t th.rs-sj{font-size:11.5px;font-weight:700;background:#fff}
table.rs-t td.rs-nm{white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
table.rs-t td.rs-nm.rs-long{font-size:9.5px;line-height:1.05;letter-spacing:-.2px;padding-top:0;padding-bottom:0}

<body>
<div id="login"></div>
<div id="main" class="hidden">

<script>
/* ===== core.js : 엑셀 해석 + 배치 로직 (브라우저/Node 공용) ===== */
(function (G) {
  'use strict';
  const S = v => (v === null || v === undefined) ? '' : String(v).trim();
  const N = v => { const m = S(v).match(/-?\d+/); return m ? parseInt(m[0], 10) : NaN; };
  const norm = v => S(v).replace(/\s+/g, '');
  const slotKey = (d, p) => d + '-' + p;
  const parseSlotKey = k => { const [d, p] = k.split('-').map(Number); return { day: d, period: p }; };
  const sidOf = (g, c, n) => g * 10000 + c * 100 + n;
  const cmpNum = (a, b) => a - b;
  const STUDY = '자습';   // 고사 시간표에 넣는 '전원 자습' 칸

  /* ---------- 공통: 헤더 행 찾기 ---------- */
  function findHeader(rows, required, maxScan = 15) {
    for (let r = 0; r < Math.min(rows.length, maxScan); r++) {
      const hs = (rows[r] || []).map(norm);
      if (required.every(fn => hs.some(fn))) return r;
    }
    return -1;
  }
  const colIdx = (hs, fn) => hs.findIndex(fn);

  /* ---------- 나이스 학생편성현황 ---------- */
  function parseNice(sheets) {
    for (const [sheetName, rows] of Object.entries(sheets)) {
      const req = [h => h.endsWith('성명'), h => h.endsWith('번호'), h => h.includes('개설과목')];
      const hr = findHeader(rows, req);
      if (hr < 0) continue;
      const hs = rows[hr].map(norm);
      const C = {
        year: colIdx(hs, h => h.endsWith('학년도')),
        sem: colIdx(hs, h => h.endsWith('학기')),
        grade: colIdx(hs, h => h.endsWith('학년') && !h.includes('계열')),
        group: colIdx(hs, h => h.endsWith('편제명')),
        subj: colIdx(hs, h => /개설과목\(/.test(h) || h === '개설과목' || h.endsWith('/개설과목')),
        room: colIdx(hs, h => h.includes('강의실')),
        sgrade: colIdx(hs, h => h.includes('계열')),
        cls: colIdx(hs, h => h === '반' || h.endsWith('/반')),
        num: colIdx(hs, h => h.endsWith('번호')),
        name: colIdx(hs, h => h.endsWith('성명')),
      };
      if (C.cls < 0 || C.num < 0 || C.name < 0 || C.subj < 0) continue;
      const byGrade = {};
      let skippedJoint = 0, skippedBad = 0;
      for (let r = hr + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        const name = S(row[C.name]); if (!name) continue;
        const clsRaw = S(row[C.cls]);
        if (/공동|교육과정반/.test(clsRaw)) { skippedJoint++; continue; }
        const cls = N(clsRaw), num = N(row[C.num]);
        let grade = C.grade >= 0 ? N(row[C.grade]) : NaN;
        if (isNaN(grade) && C.sgrade >= 0) grade = N(row[C.sgrade]);
        if (isNaN(cls) || isNaN(num) || isNaN(grade) || cls < 1 || num < 1) { skippedBad++; continue; }
        const subj = S(row[C.subj]).replace(/\s*\(\d+\)\s*$/, '').trim();
        if (!subj) continue;
        const g = byGrade[grade] || (byGrade[grade] = {
          grade, year: C.year >= 0 ? N(row[C.year]) : NaN, semester: C.sem >= 0 ? N(row[C.sem]) : NaN,
          st: new Map(), subjects: new Map(), enroll: {}, niceRoom: {}
        });
        const id = sidOf(grade, cls, num);
        if (!g.st.has(id)) g.st.set(id, { id, cls, num, name, status: '재학' });
        let room = S(row[C.room]);
        const m = room.match(/^\d+\s*\(\s*(\d+)\s*학년\s*(\d+)\s*반\s*\)$/);
        if (m) room = m[1] + '-' + m[2];
        if (!g.subjects.has(subj)) g.subjects.set(subj, { name: subj, group: C.group >= 0 ? S(row[C.group]) : '', rooms: new Set() });
        if (room) g.subjects.get(subj).rooms.add(room);
        (g.enroll[subj] || (g.enroll[subj] = [])).push(id);
        if (room) (g.niceRoom[subj] || (g.niceRoom[subj] = {}))[id] = room;
      }
      const grades = Object.values(byGrade).map(g => {
        const students = [...g.st.values()].sort((a, b) => a.id - b.id);
        const subjects = [...g.subjects.values()].map(s => ({ name: s.name, group: s.group, rooms: [...s.rooms].sort() }));
        subjects.sort((a, b) => (a.group || '').localeCompare(b.group || '', 'ko') || a.name.localeCompare(b.name, 'ko'));
        for (const k in g.enroll) g.enroll[k] = [...new Set(g.enroll[k])].sort(cmpNum);
        return {
          grade: g.grade, year: isNaN(g.year) ? null : g.year, semester: isNaN(g.semester) ? null : g.semester,
          students, subjects, enroll: g.enroll, niceRoom: g.niceRoom
        };
      }).sort((a, b) => a.grade - b.grade);
      if (grades.length) return { sheetName, grades, skippedJoint, skippedBad };
    }
    return null;
  }

  /* ---------- 학생개인별시험시간표 (배치종합 등) ---------- */
  function parseDateText(v, year) {
    if (typeof v === 'number' && v > 30000 && v < 80000) {           // 엑셀 날짜 일련번호
      const d = new Date(Math.round((v - 25569) * 86400000));
      return d.toISOString().slice(0, 10);
    }
    const s = S(v);
    let m = s.match(/(\d{4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/);
    if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
    m = s.match(/(\d{1,2})\s*[월./-]\s*(\d{1,2})/);
    if (m && year) return `${year}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;
    return null;
  }

  function parseExamFile(sheets, fallbackYear) {
    const out = { dates: {}, grades: {}, warnings: [], nice: null, year: null, source: null };
    out.nice = parseNice(sheets);
    out.year = (out.nice && out.nice.grades[0] && out.nice.grades[0].year) || fallbackYear || new Date().getFullYear();

    // 1) 배치종합
    let found = false;
    for (const [sheetName, rows] of Object.entries(sheets)) {
      const req = [h => h.includes('좌석'), h => h.includes('학번'), h => h === '교과' || h.includes('과목'), h => h.includes('시험실'), h => h === '교시'];
      const hr = findHeader(rows, req, 6);
      if (hr < 0) continue;
      const hs = rows[hr].map(norm);
      const C = {
        day: colIdx(hs, h => h.includes('시험일') || h === '일차' || h.includes('평가일')),
        period: colIdx(hs, h => h === '교시'),
        subj: colIdx(hs, h => h === '교과' || h.includes('과목')),
        room: colIdx(hs, h => h === '시험실' || (h.includes('시험실') && !h.endsWith('2'))),
        seat: colIdx(hs, h => h.includes('좌석')),
        sid: colIdx(hs, h => h.includes('학번')),
        name: colIdx(hs, h => h === '이름' || h === '성명'),
      };
      if (C.day < 0) continue;
      found = true; out.source = sheetName;
      const dayOfDate = {}; let dayAuto = 0;
      for (let r = hr + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        const sid = N(row[C.sid]); if (isNaN(sid) || sid < 10000) continue;
        let dayRaw = row[C.day], day;
        const md = S(dayRaw).match(/^(\d+)\s*일차/);
        if (md) day = +md[1];
        else {
          const iso = parseDateText(dayRaw, out.year);
          if (!iso) continue;
          if (!dayOfDate[iso]) { dayOfDate[iso] = ++dayAuto; out.dates[dayAuto] = iso; }
          day = dayOfDate[iso];
        }
        const period = N(row[C.period]); if (isNaN(period)) continue;
        const subj = S(row[C.subj]) || '자습';
        const room = S(row[C.room]);
        const seat = N(row[C.seat]);
        const g = Math.floor(sid / 10000);
        const G2 = out.grades[g] || (out.grades[g] = { slots: {}, names: {} });
        const k = slotKey(day, period);
        const sl = G2.slots[k] || (G2.slots[k] = { subjects: [], rows: [] });
        if (subj !== '자습' && !sl.subjects.includes(subj)) sl.subjects.push(subj);
        sl.rows.push([sid, subj, room, isNaN(seat) ? null : seat]);
        if (C.name >= 0) G2.names[sid] = S(row[C.name]);
      }
      break;
    }
    if (!found) out.warnings.push('배치종합(시험일·교시·교과·시험실·좌석번호·학번) 형식의 시트를 찾지 못했습니다.');

    // 2) 평가일 (예: "1일차" | "10월 12일(월)")
    for (const [name, rows] of Object.entries(sheets)) {
      if (Object.keys(out.dates).length && !/평가일정|일정/.test(name)) continue;
      for (const row of rows) {
        for (let c = 0; c < (row || []).length - 1; c++) {
          const m = S(row[c]).match(/^(\d+)\s*일차$/);
          if (!m) continue;
          const iso = parseDateText(row[c + 1], out.year);
          if (iso && !out.dates[+m[1]]) out.dates[+m[1]] = iso;
        }
      }
    }
    // 중복 학생-슬롯 확인
    for (const [g, G2] of Object.entries(out.grades)) {
      for (const [k, sl] of Object.entries(G2.slots)) {
        const seen = new Set();
        sl.rows = sl.rows.filter(r => { if (seen.has(r[0])) { out.warnings.push(`${g}학년 ${k} 학번 ${r[0]} 중복 행 무시`); return false; } seen.add(r[0]); return true; });
      }
    }
    return out;
  }

  /* ---------- 학년 문서 헬퍼 ---------- */
  const active = gd => gd.students.filter(s => s.status !== '전출');
  function subjectInfo(gd) {
    const act = new Set(active(gd).map(s => s.id));
    const res = {};
    for (const s of gd.subjects) {
      const ids = (gd.enroll[s.name] || []).filter(id => act.has(id));
      res[s.name] = { ...s, count: ids.length, type: ids.length >= act.size && act.size > 0 ? '공통' : '선택', ids };
    }
    return res;
  }
  // 한 칸에 들어간 과목들 중 한 학생이 2과목 이상 겹치는 인원
  function slotConflicts(gd, subjects) {
    subjects = (subjects || []).filter(x => x !== STUDY);
    if (subjects.length < 2) return [];
    const act = new Set(active(gd).map(s => s.id)), cnt = {};
    for (const sub of subjects) for (const id of (gd.enroll[sub] || [])) if (act.has(id)) cnt[id] = (cnt[id] || 0) + 1;
    return Object.keys(cnt).filter(id => cnt[id] > 1).map(Number);
  }
  function subjectOfStudent(gd, sid, subjects) {
    for (const sub of subjects || []) if ((gd.enroll[sub] || []).includes(sid)) return sub;
    return null;
  }
  const classRooms = gd => [...new Set(active(gd).map(s => s.cls))].sort(cmpNum).map(c => gd.grade + '-' + c);

  // 그날 그 학년 마지막 시험 교시 (이후 = 하교)
  function lastExamPeriod(gradeSlots, day) {
    let last = 0;
    for (const [k, subs] of Object.entries(gradeSlots || {})) {
      const { day: d, period: p } = parseSlotKey(k);
      if (d === day && subs && subs.length) last = Math.max(last, p);
    }
    return last;
  }

  /* ---------- 자동 배치 ----------
     mode: 'home'  = 각자교실(응시자 앞번호, 미응시(자습) 뒤)
           'split' = 별실(과목별로 교실을 순서대로 채우고, 자습은 남은 교실)  */
  // present(sid) : 이 교시에 학교에 남아 있어야 하는지 (자습 포함). 없으면 전원.
  function buildSlot(gd, subjects, mode, opt = {}, present) {
    const st = active(gd).slice().sort((a, b) => a.id - b.id);
    const subjOf = {}; st.forEach(s => subjOf[s.id] = subjectOfStudent(gd, s.id, subjects) || '자습');
    const inRoom = st.filter(s => subjOf[s.id] !== '자습' || !present || present(s.id));
    const rows = [];
    const allCommon = st.every(s => subjOf[s.id] !== '자습');
    if (mode === 'home' || allCommon) {
      const byCls = {};
      inRoom.forEach(s => (byCls[s.cls] || (byCls[s.cls] = [])).push(s));
      for (const c of Object.keys(byCls).map(Number).sort(cmpNum)) {
        const list = byCls[c];
        const takers = list.filter(s => subjOf[s.id] !== '자습'), rest = list.filter(s => subjOf[s.id] === '자습');
        [...takers, ...rest].forEach((s, i) => rows.push([s.id, subjOf[s.id], gd.grade + '-' + c, i + 1]));
      }
      return { rows, overflow: 0 };
    }
    const rooms = (opt.rooms && opt.rooms.length) ? opt.rooms.slice() : classRooms(gd);
    const cap = opt.capacity || 36;
    let ri = 0, overflow = 0;
    const nextRoom = () => { if (ri < rooms.length) return rooms[ri++]; overflow++; return '추가' + overflow; };
    const place = list => {
      let room = null, seat = 0;
      for (const s of list) {
        if (!room || seat >= cap) { room = nextRoom(); seat = 0; }
        rows.push([s.id, subjOf[s.id], room, ++seat]);
      }
    };
    for (const sub of subjects) place(inRoom.filter(s => subjOf[s.id] === sub));
    // 자습: 남은 교실 중 뒤쪽 교실부터 고르게 분산
    const rest = inRoom.filter(s => subjOf[s.id] === '자습');
    if (rest.length) {
      const remain = rooms.slice(ri);
      const need = Math.max(1, Math.ceil(rest.length / cap));
      const use = remain.length >= need ? remain.slice(remain.length - need) : remain.concat(Array.from({ length: need - remain.length }, () => '추가' + (++overflow)));
      const per = Math.ceil(rest.length / use.length);
      rest.forEach((s, i) => rows.push([s.id, '자습', use[Math.floor(i / per)], (i % per) + 1]));
    }
    return { rows, overflow };
  }

  // 학생별·일자별 마지막 응시 교시
  function studentLastPeriods(gd, gradeSlots) {
    const last = {};   // last[day][sid] = period
    for (const [k, subs] of Object.entries(gradeSlots || {})) {
      if (!subs || !subs.length) continue;
      const { day, period } = parseSlotKey(k);
      const L = last[day] || (last[day] = {});
      const ids = subs.includes(STUDY) ? active(gd).map(s => s.id) : subs.flatMap(sub => gd.enroll[sub] || []);
      for (const id of ids) if (!L[id] || L[id] < period) L[id] = period;
    }
    return last;
  }

  function buildAssignments(gd, gradeSlots, modes = {}, opt = {}) {
    const slots = {}, notes = [];
    const last = studentLastPeriods(gd, gradeSlots);
    const presentFn = (day, period) => sid => ((last[day] || {})[sid] || 0) > period;
    for (const [k, subs] of Object.entries(gradeSlots || {})) {
      if (!subs || !subs.length) continue;
      const { day, period } = parseSlotKey(k);
      const real = subs.filter(x => x !== STUDY), allStudy = subs.includes(STUDY);
      const mode = real.length ? (modes[k] || 'home') : 'home';
      // '자습'이 들어간 칸: 시험 없는 학생 전원이 (이후 시험 여부와 관계없이) 자습
      const r = buildSlot(gd, real, mode, opt[k] || opt, allStudy ? null : presentFn(day, period));
      if (r.overflow) notes.push(`${k}: 교실이 부족해 '추가' 교실 ${r.overflow}개가 생겼습니다.`);
      slots[k] = real.length ? { rows: r.rows, mode } : { rows: r.rows, mode: 'home', study: true };
    }
    // 시험 사이 빈 교시 = 자습(본인 교실), 이후 시험이 있는 학생만
    const days = new Set(Object.keys(gradeSlots || {}).map(k => parseSlotKey(k).day));
    for (const d of days) {
      const lastP = lastExamPeriod(gradeSlots, d);
      for (let p = 1; p < lastP; p++) {
        const k = slotKey(d, p);
        if (slots[k]) continue;
        const r = buildSlot(gd, [], 'home', {}, presentFn(d, p));
        if (r.rows.length) slots[k] = { rows: r.rows, mode: 'home', study: true };
      }
    }
    return { slots, notes };
  }

  /* ---------- 전입생 배치 추가 ---------- */
  // gradeSlots(있으면): 이후 시험이 없는 교시(하교)에는 넣지 않음
  function addStudentToAssign(assign, gd, stu, gradeSlots) {
    const added = [];
    const last = gradeSlots ? studentLastPeriods(gd, gradeSlots) : null;
    for (const [k, sl] of Object.entries(assign.slots || {})) {
      if (sl.rows.some(r => r[0] === stu.id)) continue;
      const subjects = [...new Set(sl.rows.map(r => r[1]).filter(s => s !== '자습'))];
      const subj = subjectOfStudent(gd, stu.id, subjects) || '자습';
      if (subj === '자습' && last) { const { day, period } = parseSlotKey(k); if (!(((last[day] || {})[stu.id] || 0) > period)) continue; }
      const clsPrefix = Math.floor(stu.id / 100);
      const same = sl.rows.filter(r => r[1] === subj);
      const vote = {};
      same.filter(r => Math.floor(r[0] / 100) === clsPrefix).forEach(r => vote[r[2]] = (vote[r[2]] || 0) + 1);
      let room = Object.keys(vote).sort((a, b) => vote[b] - vote[a])[0];
      if (!room) {
        const cnt = {}; same.forEach(r => cnt[r[2]] = (cnt[r[2]] || 0) + 1);
        room = Object.keys(cnt).sort((a, b) => cnt[a] - cnt[b])[0] || (gd.grade + '-' + stu.cls);
      }
      const seat = Math.max(0, ...sl.rows.filter(r => r[2] === room).map(r => r[3] || 0)) + 1;
      sl.rows.push([stu.id, subj, room, seat]);
      added.push({ slot: k, subj, room, seat });
    }
    return added;
  }
  function removeStudentFromAssign(assign, sid) {
    let n = 0;

/* ===== api.js : Supabase RPC / 체험(로컬) 모드 공용 인터페이스 ===== */

  async function rpcRemote(fn, args) {

  function admin(db, code, token) {
    const s = school(db, code), ss = db.sessions[token];
    if (!ss || ss.code !== s.code || ss.exp < Date.now()) throw new Error('관리자 로그인이 필요합니다(세션 만료)');
    ss.exp = Date.now() + 3 * 3600e3; return s;
  }
  const local = {
    async create_school({ p_name, p_admin_pw }) {
      if (!p_name || p_name.trim().length < 2) throw new Error('학교 이름을 입력하세요');
      if (!p_admin_pw || p_admin_pw.length < 6) throw new Error('관리자 비밀번호는 6자 이상이어야 합니다');

    async school_login({ p_code }) { const s = school(load(), p_code); return { name: s.name, code: s.code }; },
    async admin_login({ p_code, p_pw }) {

    async admin_logout({ p_token }) { const db = load(); delete db.sessions[p_token]; save(db); },
    async admin_change_pw({ p_code, p_token, p_old, p_new }) {

    async get_docs({ p_code, p_keys }) {

    },
    async get_doc_versions({ p_code }) { const s = school(load(), p_code); return Object.entries(s.docs).map(([key, v]) => ({ key, updated_at: v.at })); },
    async put_doc({ p_code, p_token, p_key, p_data }) { const db = load(), s = admin(db, p_code, p_token), at = now(); s.docs[p_key] = { data: p_data, at }; save(db); return at; },
    async delete_doc({ p_code, p_token, p_key }) { const db = load(), s = admin(db, p_code, p_token); delete s.docs[p_key]; save(db); },
    async set_absence(a) {

    },
    async list_meals({ p_code, p_from, p_to }) { return (school(load(), p_code).meals || []).filter(x => x.date >= p_from && x.date <= p_to).sort((a, b) => a.date.localeCompare(b.date) || a.sid - b.sid); },
    async purge_before({ p_code, p_token, p_date }) {

  };

  async function rpc(fn, args) {

  const u = roomMaxUse(room); return u ? { n: u, basis: '최대 사용' } : { n: 36, basis: '기본' };
}

  const L = St.docs.layouts || {}, r = (L.rooms || {})[room] || {};

  const seats = custom ? r.counts.reduce((a, b) => a + b, 0) : (r.seats || roomBaseSeats(room));
  return { seats, counts: custom ? r.counts.slice() : Core.colPattern(seats, L.presets), start: r.start || L.start || 'window', custom, set: !!(r.seats || custom) };
}

/* ---------- 서버 통신 ---------- */
async function rpc(fn, args) {
  try { return await Api.rpc(fn, Object.assign({ p_code: St.code }, args || {})); }
  catch (e) {
    if (/관리자 로그인이 필요/.test(e.message)) { setToken(null); render(); }
    throw e;
  }
}
async function loadDocs(keys) {
  const rows = await rpc('get_docs', { p_keys: keys || null });
  if (!keys) { St.docs = {}; St.vers = {}; }
  for (const r of rows) { St.docs[r.key] = r.data; St.vers[r.key] = r.updated_at; }
  St.memo = {};
}
async function saveDoc(key, data) {
  const at = await rpc('put_doc', { p_token: St.token, p_key: key, p_data: data });
  St.docs[key] = data; St.vers[key] = at; St.memo = {};
  Api.rtSend({ t: 'doc', key });
}
async function deleteDoc(key) {
  await rpc('delete_doc', { p_token: St.token, p_key: key });
  delete St.docs[key]; delete St.vers[key]; St.memo = {};
  Api.rtSend({ t: 'doc', key });
}
async function checkVersions(force) {
  if (!St.code) return;
  try {
    const vs = await rpc('get_doc_versions');
    const remote = Object.fromEntries(vs.map(v => [v.key, v.updated_at]));
    const tm = v => v ? new Date(v).getTime() : 0;
    const changed = Object.keys(remote).filter(k => tm(remote[k]) !== tm(St.vers[k]));
    const removed = Object.keys(St.vers).filter(k => !(k in remote));
    if (!changed.length && !removed.length && !force) return;
    removed.forEach(k => { delete St.docs[k]; delete St.vers[k]; });
    if (changed.length) await loadDocs(changed); else St.memo = {};
    if (St.tab === 'admin') toast('다른 화면에서 설정이 변경되어 새로 불러왔습니다.');
    render();
  } catch (e) { /* 조용히 무시 */ }
}
async function loadAbs(date, force) {
  if (!date) return [];
  if (!force && St.abs[date]) return St.abs[date];
  St.abs[date] = await rpc('list_absences', { p_from: date, p_to: date });
  St.subs[date] = await rpc('list_submissions', { p_date: date });
  return St.abs[date];
}

function seatCtx(g, day, period, room) {
  const k = Core.slotKey(day, period), a = assignOf(g);
  const rows = (a && a.slots[k] ? a.slots[k].rows : []).filter(r => r[2] === room);
  const date = dateOf(day), am = date ? absMap(date, period) : new Map();
  const bySeat = new Map(); let maxSeat = 0;
  rows.forEach(r => { if (r[3]) { bySeat.set(r[3], r); maxSeat = Math.max(maxSeat, r[3]); } });
  let extra = maxSeat; rows.filter(r => !r[3]).forEach(r => { r = r.slice(); r[3] = ++extra; bySeat.set(r[3], r); });
  const subjCnt = {}; rows.forEach(r => subjCnt[r[1]] = (subjCnt[r[1]] || 0) + 1);
  const n = Math.max(maxSeat, extra), layout = layoutFor(room);
  if (n > layout.seats) { layout.counts = Core.colPattern(n, (St.docs.layouts || {}).presets); layout.over = n; }
  return { g, day, period, room, rows, date, am, bySeat, n, subjCnt, layout };
}

  // 교시별 요약: 과목(시험실별 인원) · 자습 · 하교

async function sanitizeOoxml(buf) {
  const z = await JSZip.loadAsync(buf);
  for (const f of Object.keys(z.files)) {
    if (/vbaProject|activeX|\/media\/|drawings|ctrlProps|printerSettings/.test(f)) { z.remove(f); continue; }
    if (!/\.(xml|rels)$/i.test(f)) continue;
    let s = await z.file(f).async('string');
    s = s.replace(/\s*=\s*"/g, '="').replace(/<(\/?)x:/g, '<$1').replace(/xmlns:x=/g, 'xmlns=').replace(/<\/?hs:[^>]*>/g, '');
    z.file(f, s);
  }
  return z.generateAsync({ type: 'uint8array' });
}
async function readBook(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let wb = null;
  try { wb = XLSX.read(buf, { type: 'array' }); } catch (e) { wb = null; }
  const ok = wb && wb.SheetNames.length && wb.SheetNames.every(n => wb.Sheets[n]);
  if (!ok) {
    try { wb = XLSX.read(await sanitizeOoxml(buf), { type: 'array' }); }
    catch (e) { throw new Error('엑셀 파일을 읽지 못했습니다. 엑셀에서 “다른 이름으로 저장 → .xlsx”로 저장한 뒤 다시 올려 주세요.'); }
  }
  const out = {};
  for (const n of wb.SheetNames) if (wb.Sheets[n]) out[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true });
  return out;
}
function bindDrop(id, onFiles, multiple) {

  el.appendChild(inp);
  el.addEventListener('click', e => { if (e.target !== inp) inp.click(); });
  inp.addEventListener('change', () => { if (inp.files.length) onFiles([...inp.files]); inp.value = ''; });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
}

function xc(ws, r, c, v, st = {}) {

/* =========================================================

    <tbody>${list.map(s => `<tr><td>${s.num}</td><td class="nowrap">${esc(s.name)}</td>${cols.map(({ d, has, mm }) => {

    }).join('')}</tr>`).join('') || `<tr><td colspan="${2 + cols.length}" class="muted">학생이 없습니다.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:12px">${done ? `<span class="tag ok">✓ 입력 완료</span><button class="btn sm" data-act="meal-submit" data-done="0">완료 취소</button>` : '<button class="btn pri" data-act="meal-submit" data-done="1">입력 완료 (고사본부에 알림)</button><span class="small muted">신청자가 없어도 완료를 눌러 주세요.</span>'}</div></div>`;

async function setMeals(date, studs, on) {
  const rows = studs.map(({ g, s }) => ({ sid: s.id, grade: g, cls: s.cls, num: s.num, name: s.name }));
  const mm = St.meals[date] || (St.meals[date] = new Map());
  rows.forEach(r => on ? mm.set(r.sid, Object.assign({ date }, r)) : mm.delete(r.sid));
  render();
  try { await rpc('set_meals', { p_date: date, p_on: on, p_rows: rows }); Api.rtSend({ t: 'meal', date }); }
  catch (e) { toast('저장 실패: ' + e.message, true); await loadMeals(true).catch(() => { }); render(); }
}
A['meal-tog'] = b => {
  const g = +St.ui.meal.grade, sid = +b.dataset.sid, s = stuMap(g).get(sid); if (!s) return;
  setMeals(b.dataset.date, [{ g, s }], !mealMap(b.dataset.date).has(sid));
};
A['meal-all'] = async b => {
  const u = St.ui.meal, g = +u.grade, c = +u.cls, date = b.dataset.date, on = b.dataset.on === '1', mm = mealMap(date);
  const list = Core.active(GD(g)).filter(s => s.cls === c && (on ? !mm.has(s.id) : mm.has(s.id)));
  if (!list.length) return toast(on ? '모두 이미 신청되어 있습니다' : '신청한 학생이 없습니다');
  if (!await confirmBox(`${g}학년 ${c}반 ${fmtDate(date)} — ${list.length}명을 ${on ? '모두 신청' : '모두 신청 취소'}할까요?`, { ok: on ? '모두 신청' : '모두 취소', danger: !on })) return;
  setMeals(date, list.map(s => ({ g, s })), on);
};
A['meal-reload'] = async () => { try { await loadMeals(true); await checkVersions(); render(); toast('새로 불러왔습니다'); } catch (e) { toast(e.message, true); } };
A['meal-submit'] = async b => {
  const u = St.ui.meal, unit = `M:${u.grade}-${u.cls}`, on = b.dataset.done === '1';
  try { for (const d of mealDays()) await rpc('mark_submission', { p_date: d.date, p_period: 0, p_unit: unit, p_done: on }); await loadMeals(true); Api.rtSend({ t: 'meal' }); render(); toast(on ? '입력 완료를 알렸습니다' : '완료를 취소했습니다'); }
  catch (e) { toast(e.message, true); }
};

/* ---------- 고사본부: 일자·학년별 현황 + 시청각실 출석부 ---------- */
const MEAL_GROUPS = [
  { k: 1, t: '1교시 종료', d: '2교시부터 시청각실 대기 → 3교시 후 급식', wait: true },
  { k: 2, t: '2교시 종료', d: '3교시에 시청각실 대기 → 3교시 후 급식', wait: true },
  { k: 3, t: '3교시 종료', d: '3교시 후 바로 급식' },
  { k: 4, t: '4교시 종료', d: '4교시 후 급식' },
  { k: 0, t: '시험 없음', d: '그날 시험이 없는 학생(확인 필요)' },
];
function mealData(date, day, gsel) {
  const G = gsel === 'all' ? grades() : [+gsel];
  const list = [...mealMap(date).values()].filter(r => G.includes(+r.grade || gradeOfSid(r.sid))).map(r => {
    const g = +r.grade || gradeOfSid(r.sid), s = stuMap(g).get(+r.sid);
    return { g, sid: +r.sid, cls: s ? s.cls : r.cls, num: s ? s.num : r.num, name: s ? s.name : r.name, ep: endP(g, r.sid, day), gone: !s || s.status === '전출' };
  }).sort((a, b) => a.sid - b.sid);
  const maxP = Math.max(4, ...list.map(x => x.ep));
  const groups = [...MEAL_GROUPS.filter(x => x.k), ...Array.from({ length: maxP - 4 }, (_, i) => ({ k: 5 + i, t: `${5 + i}교시 종료`, d: `${5 + i}교시 후 급식` })), MEAL_GROUPS[4]]
    .map(gr => Object.assign({}, gr, { list: list.filter(x => x.ep === gr.k) })).filter(gr => gr.list.length || (gr.k >= 1 && gr.k <= 3));
  return { G, list, groups };
}
function mealTwoUp(list) {
  const h = Math.ceil(list.length / 2), cell = (x, i) => x ? `<td>${i + 1}</td><td>${x.sid}</td><td>${esc(x.name)}</td><td></td>` : '<td></td><td></td><td></td><td></td>';
  const head = '<th style="width:7%">연번</th><th style="width:13%">학번</th><th style="width:17%">이름</th><th style="width:11%">출석</th>';
  return `<table class="ml2"><thead><tr>${head}<th class="gap"></th>${head}</tr></thead><tbody>${Array.from({ length: h }, (_, i) => `<tr>${cell(list[i], i)}<td class="gap"></td>${cell(list[i + h], i + h)}</tr>`).join('')}</tbody></table>`;
}
function mealRosterHtml(date, day, gsel, onlyWait, print) {
  const { list, groups } = mealData(date, day, gsel), t = esc(P().title || '정기고사');
  const gl = gsel === 'all' ? '전체 학년' : gsel + '학년';
  const n3 = list.filter(x => mealTime(x.ep) === 3).length, n4 = list.length - n3;
  const gg = groups.filter(gr => !onlyWait || gr.wait);
  return `<div class="${print ? 'pg ml-p' : 'screen-pg pg ml-p'}">
    <h1>급식 신청자 출석부 (시청각실)</h1>
    <div class="subt">${t} · <b>${day}일차 ${fmtDate(date)}</b> · ${gl} · 신청 <b>${list.length}명</b> (3교시 후 급식 ${n3}명 · 4교시 이후 급식 ${n4}명)</div>
    ${gg.map(gr => `<div class="mgrp"><h4>${esc(gr.t)} <span style="font-weight:400;font-size:12px">— ${esc(gr.d)} · ${gr.list.length}명</span></h4>${gr.list.length ? mealTwoUp(gr.list) : '<div class="small" style="color:#666">해당 학생 없음</div>'}</div>`).join('')}
    <div class="sign" style="margin-top:10px"><span>${esc(MEAL_WAIT_NOTE)}</span></div>
    <div class="sign"><span></span><span>2교시 감독 ____________ (인)　3교시 감독 ____________ (인)</span></div></div>`;
}
function vMealHq(v, modeSel) {

  <div class="stats" style="margin-bottom:12px">
    <div class="stat"><div class="v">${list.length}</div><div class="k">급식 신청 (${fmtDate(date, true)})</div></div>
    <div class="stat"><div class="v eg1">${cnt(1)}</div><div class="k">1교시 종료 · 시청각실 대기</div></div>
    <div class="stat"><div class="v eg2">${cnt(2)}</div><div class="k">2교시 종료 · 시청각실 대기</div></div>

  </div>
  <div class="card"><div class="row"><h3 style="margin:0">학급별 신청 현황</h3><span class="right tag ${nDone === rows.length ? 'ok' : 'warn'}">입력 완료 ${nDone}/${rows.length}반</span></div>
    <div class="tbl-wrap" style="margin-top:8px"><table class="t"><thead><tr><th>학급</th><th class="num">재적</th><th class="num">신청</th><th class="num">1교시 종료</th><th class="num">2교시 종료</th><th class="num">3교시 종료</th><th class="num">4교시 종료</th><th class="num">기타</th><th>담임 입력</th></tr></thead>
    <tbody>${G.map(g => { const R = rows.filter(r => r.g === g), sum = i => R.reduce((a, r) => a + r.by[i], 0);
      return R.map(r => `<tr><td><b>${r.g}-${r.c}</b></td><td class="num">${r.reg}</td><td class="num"><b>${r.n || ''}</b></td>${r.by.map(n => `<td class="num">${n || ''}</td>`).join('')}<td class="num">${r.etc || ''}</td><td>${!r.has ? '<span class="muted small">시험 없음</span>' : r.done ? '<span class="tag ok">완료</span>' : '<span class="tag warn">미완료</span>'}</td></tr>`).join('')
        + `<tr style="background:var(--line2)"><td><b>${g}학년 계</b></td><td class="num">${R.reduce((a, r) => a + r.reg, 0)}</td><td class="num"><b>${R.reduce((a, r) => a + r.n, 0)}</b></td>${[0, 1, 2, 3].map(i => `<td class="num">${sum(i)}</td>`).join('')}<td class="num">${R.reduce((a, r) => a + r.etc, 0) || ''}</td><td></td></tr>`; }).join('')}</tbody></table></div></div>

}
let mealTimer = null;
A['meal-print'] = () => { const u = St.ui.meal, day = +u.day; printHtml(mealRosterHtml(dateOf(day), day, u.hg, !!u.onlyWait, true), u.paper, 'A4'); };
